; Portable Office local runtime. Never use the development server for public hosting.
extension=pdo_sqlite
extension=openssl
extension=curl
; The Windows launcher supplies absolute curl.cainfo and openssl.cafile paths.
display_errors=Off
log_errors=On
expose_php=Off
date.timezone=UTC
memory_limit=128M
post_max_size=12M
upload_max_filesize=8M
max_execution_time=60
allow_url_include=Off
session.use_strict_mode=1
